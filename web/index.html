<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A Chess.com statistics PWA built with Flutter">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Chess Stats">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">

  <title>Chess Stats</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
  <link rel="stylesheet" href="assets/css/loading.css" />
  <!-- Fond pendant le chargement, assorti au thème du système (évite un
       flash blanc avant l'app en mode sombre). -->
  <meta name="color-scheme" content="light dark">
  <style>
    body { margin: 0; background: #f9f9ff; }
    @media (prefers-color-scheme: dark) { body { background: #111318; } }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <div class="loader"></div>
  </div>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    var loading = document.querySelector('#loading');
    _flutter.loader.load({
      onEntrypointLoaded: async function(engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine({
          useColorEmoji: true,
        });
        loading.remove();
        await appRunner.runApp();
      }
    });
  </script>
</body>
</html>
