name: chess_stats_pwa
description: A Chess.com statistics PWA built with Flutter
publish_to: 'none'
version: 1.6.0+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  http: ^1.1.0
  provider: ^6.0.5
  fl_chart: ^1.3.0
  shared_preferences: ^2.2.0
  intl: 0.20.3
  sembast: ^3.10.1
  sembast_web: ^2.4.7
  chess: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/css/
    - assets/map/

flutter_intl:
  enabled: true
  class_name: AppLocalizations
  main_locale: en
  arb_dir: lib/l10n
  output_dir: lib/l10n
  use_deferred_loading: false 